name: CI

on:
  push:
    branches: ["**"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "1234"
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Unit tests (no database)
        run: dotnet test Socigy.OpenSource.DB.UnitTests/Socigy.OpenSource.DB.UnitTests.csproj --verbosity normal

      - name: Configure test database connection
        run: |
          echo '{
            "ConnectionStrings": {
              "TestDb": {
                "Default": "Host=localhost;Port=5432;Username=postgres;Password=1234;Database=postgres;Pooling=true;Minimum Pool Size=1;Maximum Pool Size=20;Connection Idle Lifetime=15;Include Error Detail=true"
              }
            }
          }' > UnitTest.DB.Tests/appsettings.json

      - name: Restore
        run: dotnet restore UnitTest.DB.Tests/UnitTest.DB.Tests.csproj

      - name: Test
        run: dotnet test UnitTest.DB.Tests/UnitTest.DB.Tests.csproj --no-restore --verbosity normal

      # The Tool multi-targets net10.0-windows, so EnableWindowsTargeting is required on Linux. SOCIGY_TEST_PG
      # points the introspection round-trip test at the Postgres service so it runs (rather than self-ignoring).
      - name: Tool tests (scaffolding + introspection)
        env:
          SOCIGY_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=1234;Database=postgres"
        run: dotnet test Socigy.OpenSource.DB.Tool.Tests/Socigy.OpenSource.DB.Tool.Tests.csproj -p:EnableWindowsTargeting=true --verbosity normal

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # required for NuGet.org Trusted Publishing (OIDC)
      packages: write
      contents: write   # required to create the GitHub Release and its tag

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Check published versions
        id: version_check
        run: |
          # Each package has its own version in Directory.Build.props; a blank per-package value
          # falls back to the base <Version>. Read all three and resolve the fallbacks here.
          read_prop() { grep -oP "(?<=<$1>)[^<]+" Directory.Build.props | head -1; }
          BASE=$(read_prop "Version")
          MAIN_VER=$(read_prop "DbPackageVersion"); MAIN_VER=${MAIN_VER:-$BASE}
          HASHI_VER=$(read_prop "HashiCorpPackageVersion"); HASHI_VER=${HASHI_VER:-$BASE}
          echo "main_version=$MAIN_VER" >> "$GITHUB_OUTPUT"
          echo "hashicorp_version=$HASHI_VER" >> "$GITHUB_OUTPUT"

          # Echoes the version if that package@version already exists on nuget.org, else nothing.
          # (|| true keeps the step alive under bash pipefail when curl 404s or grep finds no match.)
          is_published() {
            curl -sf "https://api.nuget.org/v3-flatcontainer/$1/index.json" | grep -o "\"$2\"" || true
          }

          MAIN_PUB=$(is_published "socigy.opensource.db" "$MAIN_VER")
          HASHI_PUB=$(is_published "socigy.opensource.db.hashicorp" "$HASHI_VER")

          if [ -n "$MAIN_PUB" ]; then
            echo "publish_main=false" >> "$GITHUB_OUTPUT"
            echo "Socigy.OpenSource.DB $MAIN_VER already published - skipping it"
          else
            echo "publish_main=true" >> "$GITHUB_OUTPUT"
            echo "Socigy.OpenSource.DB $MAIN_VER not published - will publish"
          fi

          if [ -n "$HASHI_PUB" ]; then
            echo "publish_hashicorp=false" >> "$GITHUB_OUTPUT"
            echo "Socigy.OpenSource.DB.HashiCorp $HASHI_VER already published - skipping it"
          else
            echo "publish_hashicorp=true" >> "$GITHUB_OUTPUT"
            echo "Socigy.OpenSource.DB.HashiCorp $HASHI_VER not published - will publish"
          fi

          # Run the build/publish steps if at least one package needs publishing.
          if [ -z "$MAIN_PUB" ] || [ -z "$HASHI_PUB" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Both packages already published (main $MAIN_VER, hashicorp $HASHI_VER) - nothing to do"
          fi

      - name: Restore Tool
        if: steps.version_check.outputs.publish_main == 'true'
        run: dotnet restore Socigy.OpenSource.DB.Tool/Socigy.OpenSource.DB.Tool.csproj /p:EnableWindowsTargeting=true

      - name: Build Tool
        if: steps.version_check.outputs.publish_main == 'true'
        run: dotnet build Socigy.OpenSource.DB.Tool/Socigy.OpenSource.DB.Tool.csproj /p:EnableWindowsTargeting=true

      - name: Restore
        if: steps.version_check.outputs.publish_main == 'true'
        run: dotnet restore Socigy.OpenSource.DB/Socigy.OpenSource.DB.csproj /p:EnableWindowsTargeting=true

      - name: Build
        if: steps.version_check.outputs.publish_main == 'true'
        run: dotnet build Socigy.OpenSource.DB/Socigy.OpenSource.DB.csproj -c Release --no-restore /p:EnableWindowsTargeting=true

      - name: Pack
        if: steps.version_check.outputs.publish_main == 'true'
        run: dotnet pack Socigy.OpenSource.DB/Socigy.OpenSource.DB.csproj -c Release --no-build -o ./nupkgs /p:EnableWindowsTargeting=true

      # Optional HashiCorp Vault package. It depends on the main package (same version) via a ProjectReference,
      # so it packs without needing that version published yet. GeneratePackageOnBuild=false keeps the transitively
      # built main project from re-running its full pack.
      - name: Restore HashiCorp
        if: steps.version_check.outputs.publish_hashicorp == 'true'
        run: dotnet restore Socigy.OpenSource.DB.HashiCorp/Socigy.OpenSource.DB.HashiCorp.csproj /p:EnableWindowsTargeting=true

      - name: Build HashiCorp
        if: steps.version_check.outputs.publish_hashicorp == 'true'
        run: dotnet build Socigy.OpenSource.DB.HashiCorp/Socigy.OpenSource.DB.HashiCorp.csproj -c Release --no-restore -p:GeneratePackageOnBuild=false /p:EnableWindowsTargeting=true

      - name: Pack HashiCorp
        if: steps.version_check.outputs.publish_hashicorp == 'true'
        run: dotnet pack Socigy.OpenSource.DB.HashiCorp/Socigy.OpenSource.DB.HashiCorp.csproj -c Release --no-build -o ./nupkgs -p:GeneratePackageOnBuild=false /p:EnableWindowsTargeting=true

      # Exchange the workflow's GitHub OIDC token for a short-lived NuGet.org API key via the
      # Trusted Publishing policy. This authorizes the package owner to push ANY of their packages
      # (including new ids like Socigy.OpenSource.DB.HashiCorp) — no per-name API-key glob needed.
      - name: NuGet trusted-publishing login (OIDC)
        id: nuget_login
        if: steps.version_check.outputs.should_run == 'true'
        uses: NuGet/login@v1
        with:
          user: PatrikStohanzl   # the NuGet.org account that owns the Trusted Publishing policy

      - name: Publish to NuGet
        if: steps.version_check.outputs.should_run == 'true'
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish to GitHub Packages
        if: steps.version_check.outputs.should_run == 'true'
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push ./nupkgs/*.nupkg \
            --source github \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      # Cut a GitHub Release per package that was actually published this run, attaching that
      # package's .nupkg. Because the two packages version independently, each gets its own
      # id-prefixed tag (e.g. Socigy.OpenSource.DB-v0.3.2) so they never collide. Idempotent:
      # an existing tag is left alone instead of failing.
      - name: Create GitHub Releases
        if: steps.version_check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_MAIN: ${{ steps.version_check.outputs.publish_main }}
          PUBLISH_HASHICORP: ${{ steps.version_check.outputs.publish_hashicorp }}
          MAIN_VERSION: ${{ steps.version_check.outputs.main_version }}
          HASHICORP_VERSION: ${{ steps.version_check.outputs.hashicorp_version }}
        run: |
          # release <id> <version> <nupkg-glob>
          release() {
            local id="$1" version="$2" glob="$3"
            local tag="$id-v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists - skipping"
              return 0
            fi
            gh release create "$tag" $glob \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes
          }

          if [ "$PUBLISH_MAIN" = "true" ]; then
            release "Socigy.OpenSource.DB" "$MAIN_VERSION" "./nupkgs/Socigy.OpenSource.DB.$MAIN_VERSION.nupkg"
          fi
          if [ "$PUBLISH_HASHICORP" = "true" ]; then
            release "Socigy.OpenSource.DB.HashiCorp" "$HASHICORP_VERSION" "./nupkgs/Socigy.OpenSource.DB.HashiCorp.$HASHICORP_VERSION.nupkg"
          fi
